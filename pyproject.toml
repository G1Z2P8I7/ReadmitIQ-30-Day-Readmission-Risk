[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readmit"
version = "0.1.0"
description = "ReadmitIQ: 30-Day Hospital Readmission Risk Prediction with Calibration and Fairness Audit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sumit Gupta" }]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "fairlearn>=0.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "ucimlrepo>=0.0.6",
    "streamlit>=1.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "mlfow>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[project.scripts]
readmit = "readmit.cli:main"

[tool.setuptools]
packages = ["readmit"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
